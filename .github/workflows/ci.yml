name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familiar
    steps:
      - uses: actions/checkout@v7
        with:
          path: familiar
      - uses: actions/checkout@v7
        with:
          repository: pknull/thallus-core
          path: thallus-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familiar
    steps:
      - uses: actions/checkout@v7
        with:
          path: familiar
      - uses: actions/checkout@v7
        with:
          repository: pknull/thallus-core
          path: thallus-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familiar
    steps:
      - uses: actions/checkout@v7
        with:
          path: familiar
      - uses: actions/checkout@v7
        with:
          repository: pknull/thallus-core
          path: thallus-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familiar
    steps:
      - uses: actions/checkout@v7
        with:
          path: familiar
      - uses: actions/checkout@v7
        with:
          repository: pknull/thallus-core
          path: thallus-core

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: familiar
    steps:
      - uses: actions/checkout@v7
        with:
          path: familiar
      - uses: actions/checkout@v7
        with:
          repository: pknull/thallus-core
          path: thallus-core

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit dependencies
        run: cargo audit
